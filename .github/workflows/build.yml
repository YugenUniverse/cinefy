# Builds Cinefy on Linux, Windows and macOS for every push / pull request,
# and uploads a ready-to-run package for each.
name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*' # the version Cinefy is developed and tested with
          modules: 'qtquick3d qtshadertools qtmultimedia qtquicktimeline' # Quick3D needs timeline since 6.12
          aqtversion: '>=3.2' # the newest: Qt 6.12's Windows packages use a newer repository layout
          cache: true

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # A few jobs at a time: compiling the big generated QML files all at
      # once runs the runner out of memory.
      - name: Build
        run: cmake --build build --config Release --parallel 3

      # Qt's deploy step wants an absolute install path.
      - name: Package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: cinefy-${{ runner.os }}
          path: dist
