# Builds a Linux AppImage (one file that runs on most distributions).
#
# - Run it by hand from the Actions tab ("Run workflow"): the AppImage is
#   attached to the run as an artifact.
# - Push a version tag (git tag v1.1.0 && git push origin v1.1.0): the
#   AppImage is also published on a GitHub Release for that tag.
#
# Built on Ubuntu 22.04 so it runs on systems with glibc 2.35 or newer.
name: appimage

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the release

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*' # the version Cinefy is developed and tested with
          modules: 'qtquick3d qtshadertools qtmultimedia'
          cache: true

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfuse2

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 3 # more runs the runner out of memory
          DESTDIR=$PWD/AppDir cmake --install build --strip
          # Inside an AppImage the launcher runs the bundled binary by name.
          sed -i 's|^Exec=.*|Exec=cinefy|' AppDir/usr/share/applications/cinefy.desktop

      - name: Package
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_QT_PLUGINS: 'multimedia;waylandcompositor'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          # Wayland support (its plugin file names vary between Qt versions).
          export EXTRA_PLATFORM_PLUGINS=$(cd "$QT_ROOT_DIR/plugins/platforms" && ls libqwayland*.so | paste -sd ';')
          echo "Wayland plugins: $EXTRA_PLATFORM_PLUGINS"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          VERSION=$(grep -oP 'project\(cinefy VERSION \K[0-9.]+' CMakeLists.txt)
          export LDAI_OUTPUT="Cinefy-$VERSION-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/cinefy.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/cinefy.svg
          ls -la *.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: cinefy-appimage
          path: 'Cinefy-*.AppImage'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 'Cinefy-*.AppImage'
          generate_release_notes: true
